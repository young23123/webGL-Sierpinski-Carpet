<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>WebGL Sierpinski Carpet</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin-top: 30px;
        }

        .controls {
            margin: 20px;
            background: #fff;
            padding: 15px;
            display: inline-block;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        canvas {
            border: 1px solid #ccc;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        button {
            margin: 10px;
            padding: 8px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h2>WebGL Sierpinski Carpet</h2>

    <div class="controls">

        <label>
            분할 횟수 :
            <input
                type="range"
                id="depthSlider"
                min="0"
                max="5"
                value="3">
        </label>

        <input
            type="number"
            id="depthInput"
            min="0"
            max="5"
            step="1"
            value="3"
            style="width: 50px;">

        <br>

        <label>
            색상 :
            <input
                type="color"
                id="colorPicker"
                value="#0056b3">
        </label>

        <br>

        <button id="drawButton">
            그리기
        </button>

    </div>

    <br>

    <canvas
        id="glCanvas"
        width="600"
        height="600">
    </canvas>


<script>

    // =====================================================
    // 1. HTML 요소 및 WebGL Context 준비
    // =====================================================

    const canvas =
        document.getElementById("glCanvas");

    const depthSlider =
        document.getElementById("depthSlider");

    const depthInput =
        document.getElementById("depthInput");

    const colorPicker =
        document.getElementById("colorPicker");

    const drawButton =
        document.getElementById("drawButton");


    const gl =
        canvas.getContext("webgl");


    // WebGL 미지원 예외 처리
    if (!gl) {

        alert(
            "WebGL을 지원하지 않는 브라우저입니다."
        );

        throw new Error(
            "WebGL initialization failed."
        );
    }



    // =====================================================
    // 2. Shader Source 정의
    // =====================================================

    const vertexShaderSource = `

        attribute vec2 a_position;

        void main() {

            gl_Position =
                vec4(
                    a_position,
                    0.0,
                    1.0
                );
        }

    `;


    const fragmentShaderSource = `

        precision mediump float;

        uniform vec4 u_color;

        void main() {

            gl_FragColor =
                u_color;
        }

    `;



    // =====================================================
    // 3. Shader 생성 및 컴파일 검사
    // =====================================================

    function createShader(
        gl,
        type,
        source
    ) {

        const shader =
            gl.createShader(type);


        gl.shaderSource(
            shader,
            source
        );


        gl.compileShader(
            shader
        );


        if (
            !gl.getShaderParameter(
                shader,
                gl.COMPILE_STATUS
            )
        ) {

            console.error(
                gl.getShaderInfoLog(shader)
            );

            gl.deleteShader(
                shader
            );

            throw new Error(
                "Shader compilation failed."
            );
        }


        return shader;
    }



    const vertexShader =
        createShader(
            gl,
            gl.VERTEX_SHADER,
            vertexShaderSource
        );


    const fragmentShader =
        createShader(
            gl,
            gl.FRAGMENT_SHADER,
            fragmentShaderSource
        );



    // =====================================================
    // 4. Shader Program 생성 및 링크 검사
    // =====================================================

    const program =
        gl.createProgram();


    gl.attachShader(
        program,
        vertexShader
    );


    gl.attachShader(
        program,
        fragmentShader
    );


    gl.linkProgram(
        program
    );


    if (
        !gl.getProgramParameter(
            program,
            gl.LINK_STATUS
        )
    ) {

        console.error(
            gl.getProgramInfoLog(
                program
            )
        );

        throw new Error(
            "Shader Program linking failed."
        );
    }


    gl.useProgram(
        program
    );



    // =====================================================
    // 5. Shader 변수 위치 확인 및 Buffer 생성
    // =====================================================

    const positionLocation =
        gl.getAttribLocation(
            program,
            "a_position"
        );


    const colorLocation =
        gl.getUniformLocation(
            program,
            "u_color"
        );


    if (
        positionLocation === -1
    ) {

        throw new Error(
            "a_position attribute를 찾을 수 없습니다."
        );
    }


    if (
        colorLocation === null
    ) {

        throw new Error(
            "u_color uniform을 찾을 수 없습니다."
        );
    }



    // Buffer 객체는 한 번만 생성하고 계속 재사용
    const positionBuffer =
        gl.createBuffer();



    // =====================================================
    // 6. Sierpinski Carpet 좌표 생성
    // =====================================================

    let vertices = [];


    function addSquare(
        x,
        y,
        size
    ) {

        const x2 =
            x + size;

        const y2 =
            y + size;


        // 첫 번째 삼각형
        vertices.push(

            x, y,

            x2, y,

            x, y2
        );


        // 두 번째 삼각형
        vertices.push(

            x, y2,

            x2, y,

            x2, y2
        );
    }



    function sierpinski(
        x,
        y,
        size,
        depth
    ) {


        // 기저 조건:
        // 더 이상 분할하지 않음
        if (
            depth === 0
        ) {

            addSquare(
                x,
                y,
                size
            );

            return;
        }



        // 현재 사각형의 한 변을 3등분
        const newSize =
            size / 3;



        // 3 × 3 영역 검사
        for (
            let row = 0;
            row < 3;
            row++
        ) {


            for (
                let col = 0;
                col < 3;
                col++
            ) {


                // 정중앙 영역 제거
                if (
                    row === 1 &&
                    col === 1
                ) {

                    continue;
                }



                // 나머지 8개 영역에
                // 같은 과정 반복
                sierpinski(

                    x +
                    col *
                    newSize,

                    y +
                    row *
                    newSize,

                    newSize,

                    depth - 1
                );
            }
        }
    }



    // =====================================================
    // 7. Hex 색상을 WebGL RGB 값으로 변환
    // =====================================================

    function hexToRGB(
        hex
    ) {


        const r =
            parseInt(
                hex.substring(
                    1,
                    3
                ),
                16
            ) / 255;


        const g =
            parseInt(
                hex.substring(
                    3,
                    5
                ),
                16
            ) / 255;


        const b =
            parseInt(
                hex.substring(
                    5,
                    7
                ),
                16
            ) / 255;


        return [
            r,
            g,
            b
        ];
    }



    // =====================================================
    // 8. 렌더링 함수
    // =====================================================

    function draw() {


        // 이전 정점 배열 제거
        vertices = [];


        // 입력창 값 가져오기
        const depth =
            depthInput.valueAsNumber;


        const color =
            colorPicker.value;



        // 입력값 검사
        if (
            !Number.isInteger(
                depth
            ) ||
            depth < 0 ||
            depth > 5
        ) {

            alert(
                "분할 횟수는 0부터 5까지의 정수로 입력해주세요."
            );

            return;
        }



        // Sierpinski Carpet 좌표 생성
        sierpinski(

            -1.0,

            -1.0,

            2.0,

            depth
        );



        // =================================================
        // Buffer 데이터 갱신
        // =================================================

        gl.bindBuffer(

            gl.ARRAY_BUFFER,

            positionBuffer
        );


        gl.bufferData(

            gl.ARRAY_BUFFER,

            new Float32Array(
                vertices
            ),

            gl.DYNAMIC_DRAW
        );



        // Buffer와 Vertex Shader 연결
        gl.enableVertexAttribArray(

            positionLocation
        );


        gl.vertexAttribPointer(

            positionLocation,

            2,

            gl.FLOAT,

            false,

            0,

            0
        );



        // =================================================
        // 색상 전달
        // =================================================

        const rgb =
            hexToRGB(
                color
            );


        gl.uniform4f(

            colorLocation,

            rgb[0],

            rgb[1],

            rgb[2],

            1.0
        );



        // =================================================
        // 화면 설정
        // =================================================

        gl.viewport(

            0,

            0,

            canvas.width,

            canvas.height
        );


        gl.clearColor(

            1.0,

            1.0,

            1.0,

            1.0
        );


        gl.clear(

            gl.COLOR_BUFFER_BIT
        );



        // =================================================
        // 실제 도형 출력
        // =================================================

        gl.drawArrays(

            gl.TRIANGLES,

            0,

            vertices.length / 2
        );
    }



    // =====================================================
    // 9. UI 이벤트 처리 및 동기화
    // =====================================================

    depthSlider.addEventListener(

        "input",

        function () {

            depthInput.value =
                depthSlider.value;
        }
    );



    depthInput.addEventListener(

        "input",

        function () {


            const value =
                depthInput.valueAsNumber;


            if (
                Number.isInteger(
                    value
                ) &&
                value >= 0 &&
                value <= 5
            ) {

                depthSlider.value =
                    value;
            }
        }
    );



    drawButton.addEventListener(

        "click",

        draw
    );



    // =====================================================
    // 10. 페이지 최초 실행
    // =====================================================

    draw();

</script>

</body>

</html>
